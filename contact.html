<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Contact — Coffee King👑</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--The plain container holding the brand name-->
   <header>
    <div class="logo">Coffee King👑</div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html" >Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
   </header> 
   <!--The semantic tag for the primary content of the page-->
   <main>
    <section class="contact">
        <h1>Get in Touch</h1>
        <!--<form id=""> wraps all input fields.-->

        <p class="success" id="formSuccess">Thanks — your message has been sent!</p>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name">
                <p class="error" id="nameError"></p>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
                <p class="error" id="emailError"></p>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
                <p class="error" id="messageError"></p>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </section>
   </main>
   <!--The semantic tag for closing area of the page-->
   <footer>
    <p>&copy; 2026 Coffee King👑. All rights reserved.</p>
   </footer>

<script src="script.js"></script>

</body>
</html>
